name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
    - uses: actions/checkout@v4
    - name: Build
      shell: bash
      run: |
        set -x
        git config --global --add safe.directory '*'
        python3 -m zipfile -e pancake-xiaozhi.zip .
        cd xz_pkg
        . $IDF_PATH/export.sh
        printf '%s\n' \
          CONFIG_BOARD_TYPE_PANCAKE_S3=y \
          CONFIG_LANGUAGE_EN_US=y \
          CONFIG_WAKE_WORD_DISABLED=n \
          CONFIG_USE_ESP_WAKE_WORD=n \
          CONFIG_USE_AFE_WAKE_WORD=y \
          CONFIG_USE_CUSTOM_WAKE_WORD=n \
          CONFIG_SR_WN_WN9_HIESP=y > board.defaults
        idf.py -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;board.defaults" build 2>&1 | tail -n 300
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bin
        path: "**/build/*.bin"
