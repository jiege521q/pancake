name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  b:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
    - uses: actions/checkout@v4
    - name: Build
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        python3 -m zipfile -e pancake-xiaozhi.zip .
        cd xz_pkg
        python3 - <<'EOF'
        p='main/CMakeLists.txt'
        s=open(p).read()
        if 'esp_http_client' not in s:
            s=s.replace('set(MAIN_PRIV_REQUIRES_EXTRA "")','set(MAIN_PRIV_REQUIRES_EXTRA "")\nlist(APPEND MAIN_PRIV_REQUIRES_EXTRA esp_http_client)',1)
        open(p,'w').write(s)
        EOF
        . $IDF_PATH/export.sh
        printf '%s\n' \
          CONFIG_BOARD_TYPE_PANCAKE_S3=y \
          CONFIG_LANGUAGE_EN_US=y \
          CONFIG_WAKE_WORD_DISABLED=n \
          CONFIG_USE_ESP_WAKE_WORD=n \
          CONFIG_USE_AFE_WAKE_WORD=y \
          CONFIG_USE_CUSTOM_WAKE_WORD=n \
          CONFIG_SR_WN_WN9_HIESP=y > board.defaults
        set +e
        idf.py -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;board.defaults" build > /tmp/b.log 2>&1
        echo "exit=$?"
    - name: Report
      if: always()
      shell: bash
      run: |
        set +e
        cp /tmp/b.log build-log.txt
        grep -E "error:|fatal error" /tmp/b.log | head -n 200 > errors.txt
        git config user.name "build-bot"
        git config user.email "bot@example.com"
        git checkout -B logs
        git add -f build-log.txt errors.txt
        git commit -m "build log"
        git push -f origin logs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bin
        path: "**/build/*.bin"
